# Tags a release when CHANGELOG.md names a version that has no tag yet (Packagist picks the tag
# up). Releases are tagged here, from the CHANGELOG, so a version is never forgotten.
name: release
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md', '.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: tag the newest version
        run: |
          v=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$v" ] || { echo "no version in CHANGELOG.md"; exit 0; }
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "v$v already tagged"; exit 0; fi
          git tag "v$v" && git push origin "v$v"
          echo "::notice title=release::v$v tagged"
